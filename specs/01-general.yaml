paths:
  /ping:
    servers:
      - url: https://common-api.wildberries.ru
        description: |
          **Тарифы, Новости, Информация о продавце**
      - url: https://content-api.wildberries.ru
        description: |
          **Контент**
      - url: https://content-api-sandbox.wildberries.ru
        description: |
          **Песочница Контент**
      - url: https://seller-analytics-api.wildberries.ru
        description: |
          **Аналитика**
      - url: https://discounts-prices-api.wildberries.ru
        description: |
          **Цены и скидки**
      - url: https://discounts-prices-api-sandbox.wildberries.ru
        description: |
          **Песочница Цены и скидки**
      - url: https://marketplace-api.wildberries.ru
        description: |
          **Маркетплейс**
      - url: https://marketplace-api-sandbox.wildberries.ru
        description: |
          **Песочница Маркетплейс**
      - url: https://statistics-api.wildberries.ru
        description: |
          **Статистика**
      - url: https://advert-api.wildberries.ru
        description: |
          **Продвижение**
      - url: https://feedbacks-api.wildberries.ru
        description: |
          **Вопросы и отзывы**
      - url: https://feedbacks-api-sandbox.wildberries.ru
        description: |
          **Песочница Вопросы и отзывы**
      - url: https://buyer-chat-api.wildberries.ru
        description: |
          **Чат с покупателями**
      - url: https://supplies-api.wildberries.ru
        description: |
          **Поставки**
      - url: https://returns-api.wildberries.ru
        description: |
          **Возвраты покупателями**
      - url: https://documents-api.wildberries.ru
        description: |
          **Документы**
      - url: https://finance-api.wildberries.ru
        description: |
          **Финансы**
      - url: https://user-management-api.wildberries.ru
        description: |
          **Управление пользователями продавца**
    get:
      operationId: getPing
      x-readonly-method: true
      x-category: commonapi
      tags:
        - Проверка подключения к WB API
      security:
        - HeaderApiKey: []
      summary: Проверка подключения
      description: |
        Метод проверяет:
          1. Успешно ли запрос доходит до WB API
          2. Валидность токена авторизации и URL запроса
          3. Совпадают ли категория токена и сервис

        <div class="description_important">
          Метод не предназначен для проверки доступности сервисов WB
        </div>

        У каждого сервиса есть свой вариант метода в зависимости от домена.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/introduction/Limity-zaprosov">Лимит запросов</a> на один профиль продавца:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 30 сек | 3 запроса | 10 сек | 99 запросов |
        </div>

        Лимит действует отдельно для каждого варианта метода в зависимости от домена
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  TS:
                    type: string
                    description: Timestamp запроса
                  Status:
                    type: string
                    enum:
                      - OK
                    description: Статус
              example:
                TS: '2024-08-16T11:19:05+03:00'
                Status: OK
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: connectionCheck
  /api/communications/v2/news:
    servers:
      - url: https://common-api.wildberries.ru
    get:
      operationId: getV2News
      x-readonly-method: true
      x-category: commonapi
      tags:
        - API коммуникаций
      security:
        - HeaderApiKey: []
      summary: Получить новости портала продавцов
      description: |
        Метод позволяет получать [новости](https://seller.wildberries.ru/news-v2) портала продавцов. <br> Для получения успешного ответа необходимо указать
        один из параметров `from` или `fromID`. <br> За один запрос можно получить не более 100 новостей.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/introduction/Limity-zaprosov">Лимит запросов</a> на один профиль продавца:


        | Тип | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- | --- |
        | Персональный | 1 мин | 1 запрос | 1 мин | 10 запросов |
        | Сервисный | 1 мин | 1 запрос | 1 мин | 10 запросов |
        | Базовый с секретом | 1 мин | 1 запрос | 1 мин | 10 запросов |
        | Базовый | 1 ч | 1 запрос | 1 ч | 1 запрос |
        </div>
      parameters:
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date
            example: '2025-02-06'
          description: Дата, от которой необходимо выдать новости
        - in: query
          name: fromID
          required: false
          schema:
            type: integer
            format: uint64
          description: ID новости, начиная с которой — включая её — нужно получить список новостей
          example: 7369
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Новости
                    items:
                      type: object
                      properties:
                        content:
                          type: string
                          description: Текст новости
                          format: plaintext
                        date:
                          format: date-time
                          type: string
                          description: Дата и время публикации новости
                        header:
                          type: string
                          description: Заголовок новости
                        id:
                          type: integer
                          description: ID новости
                        types:
                          type: array
                          description: Теги новости
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: ID тега
                              name:
                                type: string
                                description: Название тега
              example:
                data:
                  - content: |
                      Теперь в кампаниях ВБ.Медиа вы можете размещать баннеры для пользователей, которые взаимодействовали
                      с товарами из определённой категории: покупали, искали, добавляли в корзину и избранное. Также можно
