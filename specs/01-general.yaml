          type: string
          example: active
          enum:
            - active
            - inactive
          description: |
            Статус подписки:
              - `active` — активна
              - `inactive` — истекла или отменена
        activationSource:
          type: string
          enum:
            - constructor
            - jam
          example: jam
          description: |
            Источник подключения подписки:
              - `constructor` — покупка через раздел **Конструктор тарифов**
              - `jam` — покупка через раздел **Подписка «Джем»**
        level:
          type: string
          enum:
            - standard
            - advanced
            - premium
          example: premium
          description: |
            Уровень подписки:
              - `standard`
              - `advanced`
              - `premium`
        since:
          type: string
          format: date-time
          example: '2026-03-16T08:38:08.056406Z'
          description: Дата и время первой активации подписки. Не меняется при продлении или повторной активации
        till:
          type: string
          format: date-time
          example: '2026-04-25T14:44:28.393587Z'
          description: Дата и время окончания подписки
    PlanBuilderOptionsInfo:
      type: object
