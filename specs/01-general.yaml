      operationId: putV1UsersAccess
      x-readonly-method: false
      x-category: usermanagement
      x-token-types:
        - personal
      tags:
        - Управление пользователями продавца
      security:
        - HeaderApiKey: []
      summary: Изменить права доступа пользователей
      description: |
        <div class="description_token">
            Метод <a href="/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API">доступен</a> по
                <strong>Персональному</strong> токену
        </div>

        Метод меняет права доступа одному или нескольким пользователям.<br>
        <br>
        Обновляются только права доступа, переданные в параметрах запроса. Остальные поля остаются без изменений.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/introduction/Limity-zaprosov">Лимит запросов</a> на один профиль продавца:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 сек | 1 запрос | 1 сек | 5 запросов |
        </div>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateUserAccessRequest'
      responses:
        '200':
          description: Успешно
        '400':
          description: Неправильный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Доступ запрещён
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
                Response403TokenType:
                  $ref: '#/components/examples/Response403TokenType'
        '429':
          $ref: '#/components/responses/429'
