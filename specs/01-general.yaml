      summary: Получить уведомления портала продавцов
      description: |

        <div class="description_token">
            Метод <a href="/openapi/api-information#tag/authorization/Pravila-ispolzovaniya-tokenov-dostupa-k-API">доступен</a> по
                <strong>Персональному</strong> токену, 
                <strong>Сервисному</strong> токену
        </div>

        Метод возвращает список уведомлений из [профиля](https://seller.wildberries.ru) продавца на русском языке. Порядок уведомлений в ответе — от новых к старым.

        Доступно только для продавцов из РФ.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/introduction/Limity-zaprosov">Лимит запросов</a> на один профиль продавца:


        | Тип | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- | --- |
        | Персональный | 1 мин | 1 запрос | 1 мин | 10 запросов |
        | Сервисный | 1 мин | 1 запрос | 1 мин | 10 запросов |
        </div>
      parameters:
        - name: from
          in: query
          required: false
          allowEmptyValue: true
          description: |
            Фильтр по дате и времени: в ответе возвращаются только уведомления, полученные до указанной даты и времени. Указывайте значения не позднее текущих.<br>
            Чтобы получить самые новые уведомления, не передавайте в запросе этот параметр.<br>
            Используйте параметр для пагинации:
              1. Отправьте первый запрос запрос без параметра `from`.
              2. В следующих запросах передайте в параметре `from` значение `date` последнего уведомления в ответе.
          schema:
            type: string
            format: date-time
          example: '2025-02-13T11:18:09.308Z'
        - name: timezone
          in: query
          required: false
          allowEmptyValue: false
          description: Временная зона в формате [IANA](https://nodatime.org/TimeZones)
          schema:
            type: string
            default: Europe/Moscow
          example: Europe/Moscow
        - name: limit
          in: query
          required: false
          allowEmptyValue: false
          description: Количество уведомлений в ответе
          schema:
            type: integer
            format: int64
            default: 10
            minimum: 5
            maximum: 100
          example: 10
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    description: Список уведомлений
                    items:
                      $ref: '#/components/schemas/SellerNotificationsResponse'
              examples:
                SellerNotificationsExample:
                  $ref: '#/components/examples/SellerNotificationsExample'
        '400':
          description: Неправильный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SellerNotificationsError'
              examples:
                SellerNotifications400:
                  $ref: '#/components/examples/SellerNotifications400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Доступ запрещён
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SellerNotificationsError'
                  - $ref: '#/components/schemas/Response4XX'
              examples:
                SellerNotifications403NotOwner:
                  $ref: '#/components/examples/SellerNotifications403NotOwner'
                SellerNotifications403Country:
                  $ref: '#/components/examples/SellerNotifications403Country'
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
