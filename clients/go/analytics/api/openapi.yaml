          description: "Метка снимка данных, в рамках которого выполняется пагинац\
            ия"
          example: 2026-07-03T15:04:05Z
          format: date-time
          type: string
        currency:
          description: Валюта отчёта
          example: RUB
          type: string
        orders:
          description: Заказы
          items:
            $ref: "#/components/schemas/Order"
          type: array
      required:
      - currency
      - orders
      - snapshotTime
      type: object
    Order:
      description: Заказ
      example:
        nmId: 47254354
        chrtId: 91663228
        srid: 7513432034713632943.1.0
        createdAt: 2026-06-24T12:57:26+03:00
        updatedAt: 2026-06-26T19:19:38+03:00
        status: cancel
        cancelType: app
        warehouseName: Склад продавца Ростов-на-Дону
        warehouseRegion: Южный и Северо-Кавказский
        isMp: true
        destinationCity: Санкт-Петербург
        destinationDistrict: Северо-Западный
        sellerPrice: 4328
        isB2b: false
      properties:
        nmId:
          description: Артикул WB
          example: 47254354
          format: int64
          type: integer
        chrtId:
          description: ID размера
          example: 91663228
          format: int64
          type: integer
        srid:
          description: ID заказа
          example: 7513432034713632943.1.0
          type: string
        createdAt:
          description: Дата и время оформления заказа
          example: 2026-06-24T12:57:26+03:00
          format: date-time
          type: string
        updatedAt:
          description: Дата и время текущего статуса. При `"status":"created"` возвращается
            значение поля `createdAt`
          example: 2026-06-26T19:19:38+03:00
          format: date-time
          type: string
        status:
          description: |
            Статус заказа:
              - `created` — оформлен
              - `buyout` — продан
              - `cancel` — отменён
              - `return` — возвращён
              - `returnDefective` — возвращён по причине брака
          enum:
          - created
          - buyout
          - cancel
          - return
          - returnDefective
          example: cancel
          type: string
        cancelType:
          description: |
            Тип отмены (при `"status":"cancel"`):
              - `app` — отказ до получения
              - `receipt` — отказ при получении
              - `expire` — истёк срок получения
              - `other` — техническая отмена
          enum:
          - app
          - receipt
          - expire
          - other
          example: app
          type: string
        warehouseName:
          description: Название склада
          example: Склад продавца Ростов-на-Дону
          type: string
        warehouseRegion:
          description: "Федеральный округ склада. Если склад не в России, возвраща\
            ется страна"
          example: Южный и Северо-Кавказский
          type: string
        isMp:
          description: |
            Тип склада:
              - `true` — склад продавца
              - `false` — склад WB
          example: true
          type: boolean
        destinationCity:
          description: Населённый пункт доставки
          example: Санкт-Петербург
          type: string
        destinationDistrict:
          description: "Федеральный округ доставки. Если доставка не по России, во\
            звращается страна"
          example: Северо-Западный
          type: string
        sellerPrice:
          description: Цена продавца со скидкой продавца (без учёта скидки WB Клуба
            и оптовой скидки для B2B-продаж)
          example: 4328
          format: float64
          type: number
        isB2b:
          description: |
            Тип продажи:
              - `true` — B2B
              - `false` — B2C
          example: false
          type: boolean
      required:
      - chrtId
      - createdAt
      - destinationCity
      - destinationDistrict
      - isB2b
      - isMp
      - nmId
      - sellerPrice
      - srid
      - status
      - updatedAt
      - warehouseName
      - warehouseRegion
      type: object
