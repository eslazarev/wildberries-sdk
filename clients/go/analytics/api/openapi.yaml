        | Сервисный | 1 мин | 3 запроса | 20 сек | 3 запроса |
        | Базовый с секретом | 1 мин | 3 запроса | 20 сек | 3 запроса |
        | Базовый | 1 ч | 2 запроса | 30 мин | 1 запрос |
        </div>
      operationId: postV3SalesFunnelGroupedHistory
