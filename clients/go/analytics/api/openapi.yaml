      description: Запрашиваемый период. По дате текущего статуса заказа
      example:
        start: 2026-07-23T00:00:00+03:00
        end: 2026-07-31T00:00:00+03:00
      properties:
        start:
          description: Дата и время начала периода. Не ранее 31 суток от текущей даты
            и не позднее `end`
          example: 2026-07-23T00:00:00+03:00
          format: date-time
          type: string
        end:
          description: Дата и время конца периода. Не ранее 31 суток от текущей даты
          example: 2026-07-31T00:00:00+03:00
          format: date-time
          type: string
      required:
      - start
      type: object
    OrderFeedRequest_pagination:
      description: Пагинация
      example:
        snapshotTime: 2026-07-28T15:04:05Z
        offset: 211
        limit: 4030
      properties:
        snapshotTime:
          description: "Метка снимка данных, в рамках которого выполняется пагинац\
            ия.<br>Данные отчёта обновляются асинхронно. Чтобы не пропускать и не\
            \ дублировать заказы, запросы одной выборки должны быть с одним и тем\
            \ же `snapshotTime`.<br>В первом запросе выборки (`\"offset\":0`) пара\
            метр не указывается, в каждом последующем запросе (`offset`>`0`) указы\
            вайте значение поля `snapshotTime` из ответа на <strong>первый</strong>\
            \ запрос.<br>При изменении значений периода и фильтров начинайте выбор\
            ку заново с `\"offset\":0` и без `snapshotTime`"
          example: 2026-07-28T15:04:05Z
          format: date-time
          type: string
        offset:
          default: 0
          description: "Сколько элементов пропустить. Например, для значения `10`\
            \ ответ начнётся с 11 элемента"
          example: 211
          format: int32
          type: integer
        limit:
          default: 50
          description: Количество заказов в ответе
          example: 4030
          format: int32
          maximum: 10000
          type: integer
      type: object
