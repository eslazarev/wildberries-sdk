info:
  description: |
    <div class="api-block">

    В этом разделе:
    - [общая информация о WB API](/openapi/api-information#tag/introduction)
    - как [начать работу с WB API](/openapi/api-information#tag/introduction/Kak-nachat-rabotu-s-API)
    - как [авторизоваться](/openapi/api-information#tag/authorization) и [создавать токены](/openapi/api-information#tag/authorization/Kak-sozdat-personalnyj-bazovyj-ili-testovyj-token)
    - основные [статус-коды ответов](/openapi/api-information#tag/introduction/Status-kody-HTTP)
    - [лимиты запросов](/openapi/api-information#tag/introduction/Limity-zaprosov)
    - как обратиться в [поддержку](/openapi/api-information#tag/introduction/Podderzhka)

    С помощью методов этого раздела вы можете:
    - проверить [подключение к WB API](/openapi/api-information#tag/connectionCheck/operation/getPing)
    - получить [новости портала продавцов](/openapi/api-information#tag/newsApi/operation/getV2News)
    - получить [информацию о продавце](/openapi/api-information#tag/sellerInformation/operation/getV1SellerInfo)
    - [управлять пользователями продавца](/openapi/api-information#tag/sellerUserManagement)

    </div>
