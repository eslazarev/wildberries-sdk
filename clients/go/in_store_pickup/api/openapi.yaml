            Цена в валюте продажи с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100.
            Код валюты продажи указан в поле `currencyCode`. Предоставляется в информационных целях
          example: 5000
          type: integer
        finalPrice:
          description: "Сумма к оплате покупателем в валюте продажи с учетом всех\
            \ скидок, умноженная на 100. Код валюты продажи указан в поле `currencyCode`.\
            \ Предоставляется в информационных целях"
          example: 5000
          type: integer
        convertedPrice:
          description: "Цена в валюте страны продавца с учетом всех скидок, кроме\
            \ скидки по WB Кошельку, умноженная на 100. Код валюты продажи указан\
            \ в поле `currencyCode`. Предоставляется в информационных целях"
          example: 5000
