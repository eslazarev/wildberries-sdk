[package]
name = "wildberries_sdk_orders_fbw"
version = "0.1.188"
authors = ["Evgenii Lazarev <elazarev@gmail.com>"]
description = "Wildberries API SDK for Rust, orders_fbw module: typed client for the Wildberries seller API, regenerated from the official OpenAPI spec."
repository = "https://github.com/eslazarev/wildberries-sdk"
homepage = "https://eslazarev.github.io/wildberries-sdk/"
documentation = "https://docs.rs/wildberries_sdk_orders_fbw"
keywords = ["wildberries", "wb", "marketplace", "api-client", "openapi"]
categories = ["api-bindings", "web-programming::http-client"]
# Override this license by providing a License Object in the OpenAPI.
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
chrono = { version = "^0.4",  features = ["serde"] }
percent-encoding = "^2.3"
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
