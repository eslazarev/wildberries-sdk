[build-system]
requires = ["setuptools>=68,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildberries-sdk"
version = "0.1.187"
description = "Wildberries API SDK for Python: typed clients for the Wildberries seller API, regenerated from the official OpenAPI specs on every change."
keywords = ["wildberries", "wildberries-api", "wildberries-sdk", "wb", "wb-api", "seller-api", "marketplace", "ecommerce", "api", "sdk", "openapi", "api-client", "вайлдберриз", "вб"]
readme = "docs/python/README.md"
requires-python = ">=3.8"
authors = [
  { name = "Evgenii Lazarev", email = "elazarev@gmail.com" },
]
license = { text = "MIT" }
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Russian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0.0",
  "urllib3>=2.6.3",
  "python-dateutil>=2.8.2",
  "typing-extensions>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/eslazarev/wildberries-sdk"
Documentation = "https://eslazarev.github.io/wildberries-sdk/"
Source = "https://github.com/eslazarev/wildberries-sdk"
Issues = "https://github.com/eslazarev/wildberries-sdk/issues"
Changelog = "https://github.com/eslazarev/wildberries-sdk/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["wildberries_sdk", "wildberries_sdk.*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
